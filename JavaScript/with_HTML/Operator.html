<!DOCTYPE html>

<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Operators Demo</title>
</head>
<body>
    
    <h1>JavaScript Operators</h1>
    <p>Addition (4 + 3): <span id="add"></span></p>
